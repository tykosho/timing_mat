# Lint rules checked in CI (.github/workflows/ci.yml). Run locally with: ruff check .
#
# Bugs only for now: syntax errors (E9), invalid comparisons (F63), misplaced
# statements (F7) and undefined names (F82). Widen to the full pyflakes set ("F")
# once the existing unused-import warnings are cleaned up (see issue #24).
target-version = "py311"

[lint]
select = ["E9", "F63", "F7", "F82"]
