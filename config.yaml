# Race Timing Mat Configuration
event:
  name: "Take Back the Track!"
  min_lap_seconds: 45.0          # Minimum realistic lap time to prevent double-counting
  crossing_window_seconds: 2.5   # Group burst tag reads within this window
  track_length_meters: 400       # unused: track length is set per event in the Admin page (default 400)
  seed_demo: null                # true/false to force demo runners; null = only in mock mode

admin:
  pin: null                      # Admin PIN (6+ digits). Prefer the ADMIN_PIN env var / .env file so it isn't committed.
                                 # Unset: mock mode runs unprotected; real-hardware mode makes up a PIN and logs it.

hardware:
  mock: true                     # Set to false on Raspberry Pi with real R200 antenna
  serial_port: "/dev/ttyUSB0"    # Default Linux/Pi serial port
  baud_rate: 115200
  rearm_interval_seconds: 300    # Restart the reader's inventory this often (it stops after 65,535 polls); 0 = off
  silence_rearm_seconds: 30      # Also restart it if no frames at all arrive for this long; 0 = off
  raw_capture_path: null         # e.g. data/r200-capture.log: log every byte to/from the reader (or set RAW_CAPTURE_PATH)
  raw_capture_max_mb: 50         # stop capturing once the file reaches this size

server:
  host: "0.0.0.0"
  port: 8000

database:
  path: "data/race.db"
