<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/fontawesome/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-sans antialiased px-4">
  <form method="post" action="/login" class="w-full max-w-xs bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
    <div>
      <h1 class="text-lg font-black text-white flex items-center gap-2">
        <i class="fa-solid fa-lock text-emerald-400"></i> Race Control
      </h1>
      <p class="text-xs text-slate-400 mt-1">Enter the admin PIN to manage the race.</p>
    </div>

    <input type="hidden" name="next" value="{{ next }}">
    <input type="password" name="pin" inputmode="numeric" autocomplete="current-password" autofocus required
           placeholder="PIN" aria-label="Admin PIN"
           class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-lg tracking-widest text-white focus:outline-none focus:border-emerald-500">

    {% if error %}
    <p class="text-sm text-red-400" role="alert">{{ error }}</p>
    {% endif %}

    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg transition">
      Log in
    </button>

    <a href="/leaderboard" class="block text-center text-xs text-slate-500 hover:text-slate-300">Back to the leaderboard</a>
  </form>
</body>
</html>
