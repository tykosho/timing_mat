name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the run still in progress (saves Actions minutes).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as the Dockerfile
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -B -m unittest discover tests -v

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff==0.17.5"

      # Rules are in ruff.toml so `ruff check .` locally matches CI.
      - name: Ruff
        run: ruff check --output-format=github .

  # app.css is committed (the Pi builds nothing), so it must match the templates.
  css:
    name: css
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Rebuild app.css (Tailwind version pinned in package-lock.json)
        run: npm ci && npm run build:css

      - name: Fail if the committed app.css is stale
        run: |
          git diff --exit-code web/static/app.css || {
            echo "::error file=web/static/app.css::app.css is out of date with web/templates. Run: npm ci && npm run build:css, then commit web/static/app.css."
            exit 1
          }

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-browser.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-browser.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # Starts the real app (mock reader) and checks every page in headless Chromium
      - name: Browser smoke tests
        run: python -B -m unittest -v tests.test_browser

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: timing-mat:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
